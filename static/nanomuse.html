<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<title>NanoMuse</title>
<script>
// iOS 18+ build. Anything missing -> fall back to the legacy page.
(function(){var ok=!!(window.WebAssembly&&window.indexedDB&&window.Worker&&window.structuredClone&&window.ReadableStream&&Array.prototype.at&&window.AbortController&&CSS&&CSS.supports&&CSS.supports('height','100dvh'));
if(!ok&&!/[?&]force=1/.test(location.search))location.replace('/legacy');})();
</script>
<style>
:root{--bg:#fff;--fg:#111;--mut:#6b7280;--card:#f2f3f5;--line:#e5e7eb;--acc:#1a88ff;--bad:#e5484d;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f2;--mut:#9aa0a6;--card:#1b1c1f;--line:#2a2b2f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:var(--sat)}
button,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:8px;cursor:pointer}
header{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--line)}
header b{flex:1;text-align:center}
#status{font-size:12px;color:var(--mut);max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chat{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.msg{margin:0 0 12px;display:flex}.msg.user{justify-content:flex-end}
.bub{max-width:92%;padding:10px 13px;border-radius:18px;overflow-wrap:anywhere}
.user .bub{background:var(--acc);color:#fff;white-space:pre-wrap}
.bot .bub{background:var(--card)}
.bub>:first-child{margin-top:0}.bub>:last-child{margin-bottom:0}
.bub pre{background:var(--bg);padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;margin:8px 0}
.bub table{border-collapse:collapse;display:block;overflow-x:auto}.bub td,.bub th{border:1px solid var(--line);padding:4px 8px}
.cb{display:flex;gap:4px;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px}
.cb button{font-size:12px;padding:2px 6px}
.chip{display:inline-block;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:12px;padding:2px 9px;margin:0 6px 6px 0}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;margin:6px 0}
.file span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file small{color:var(--mut)}
.file button{color:var(--acc);padding:4px 8px}
.err{border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:14px}
.err button{color:var(--acc)}
.dots i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.2}}
footer{padding:8px 10px calc(8px + var(--sab));border-top:1px solid var(--line)}
#atts{display:flex;gap:6px;flex-wrap:wrap}#atts .chip button{padding:0 0 0 6px}
.row{display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;background:var(--card);border:0;border-radius:18px;padding:9px 14px;outline:0}
#send{background:var(--acc);color:#fff;border-radius:50%;width:38px;height:38px;padding:0;font-size:18px}
#send:disabled{opacity:.35}
.tools{display:flex;gap:4px;margin-top:6px;font-size:13px}
.tools button{border:1px solid var(--line);border-radius:14px;padding:3px 10px;color:var(--mut)}
.tools button.on{background:var(--acc);border-color:var(--acc);color:#fff}
select{background:var(--card);border:0;border-radius:12px;padding:3px 8px;font-size:13px}
#drawer{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.45);display:none}
#drawer.open{display:block}
#dp{width:82%;max-width:320px;height:100%;background:var(--bg);padding:calc(var(--sat) + 10px) 10px 10px;overflow-y:auto}
#dp .c{display:flex;align-items:center;border-radius:10px;padding:2px 4px}#dp .c.on{background:var(--card)}
#dp .c span{flex:1;padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dp .new{width:100%;background:var(--acc);color:#fff;border-radius:12px;margin-bottom:8px}
.av{width:30px;height:30px;flex:none;margin:0 8px 0 0;border-radius:50%;overflow:hidden;background:var(--card);align-self:flex-end}
.av svg{width:100%;height:100%;display:block}
.hero{padding:18px 4px}.hero h1{font-size:24px;line-height:1.2;margin:0 0 4px}.hero>p{color:var(--mut);margin:0 0 16px}
.hero h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 0 6px}
.hero button{display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:10px 13px;margin:0 0 6px}
#sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#sheet.open{display:flex}
#sheet .p{width:100%;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(16px + var(--sab));max-height:80dvh;overflow-y:auto}
#sheet h4{margin:0 0 6px;font-size:17px}#sheet pre{white-space:pre-wrap;background:var(--card);border-radius:12px;padding:10px;font-size:13px;margin:8px 0}
#sheet .b{display:flex;gap:8px;margin-top:12px}#sheet .b button{flex:1;border-radius:14px;padding:12px;background:var(--card)}
#sheet .b .ok{background:var(--acc);color:#fff;font-weight:600}
.looks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.looks button{background:var(--card);border-radius:16px;padding:6px}.looks svg{width:100%;height:auto}
#banner{position:fixed;left:10px;right:10px;top:calc(var(--sat) + 8px);z-index:10;background:var(--acc);color:#fff;border-radius:14px;padding:12px 14px;display:none}
#banner.open{display:block}
.mem{display:flex;align-items:center;font-size:14px;color:var(--mut)}.mem span{flex:1;padding:4px}
#dp h5{margin:14px 6px 4px;font-size:12px;color:var(--mut);text-transform:uppercase}
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="Conversations">☰</button>
  <b>NanoMuse</b><span id="status">ready</span><button id="lang" aria-label="Language">中/EN</button>
</header>
<div id="chat"></div>
<footer>
  <div id="atts"></div>
  <div class="row">
    <button id="attach" aria-label="Attach">＋</button>
    <textarea id="in" rows="1" placeholder="Message, or ask for a file…" enterkeyhint="send"></textarea>
    <button id="send" aria-label="Send" disabled>↑</button>
  </div>
  <div class="tools">
    <select id="prof"><option>balanced</option></select>
    <button id="oweb" class="on">Web</button>
    <button id="ocode" class="on">Files</button>
    <button id="olocal">Local Python</button>
  </div>
</footer>
<div id="sheet"><div class="p" id="sp"></div></div><div id="banner"></div>
<div id="drawer"><div id="dp"></div></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const chat=$('chat'),inp=$('in'),sendB=$('send'),stat=$('status');

/* ---------- storage: IndexedDB (conversations, runs, file blobs survive reloads) ---------- */
const dbP=new Promise((res,rej)=>{const r=indexedDB.open('nanomuse',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('files')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(s,m,f)=>{const d=await dbP;return new Promise((res,rej)=>{const t=d.transaction(s,m);const q=f(t.objectStore(s));
  t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
const kget=(s,k)=>tx(s,'readonly',o=>o.get(k)), kput=(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k)), kdel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
try{navigator.storage?.persist?.()}catch{}

let convs=[],cur=null,opts=Object.assign({web:true,code:true,local:false},ls.get('nm.opts',{})),profile=ls.get('nm.profile','balanced');
let mem=[],rem=[],look='',lang=ls.get('nm.lang',/^zh/i.test(navigator.language)?'zh':'en');
const MARK='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#1a88ff"/><circle cx="35" cy="45" r="7" fill="#fff"/><circle cx="65" cy="45" r="7" fill="#fff"/><path d="M32 65q18 14 36 0" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></svg>';
const T={en:{ph:'Message, or ask for a file…',new:'New chat',mem:'Memory',none:'Nothing yet',title:'A nanoMuse of your own',sub:'Change its look, let it act on your phone (always with your OK), make it remember and remind.',
 allow:'Allow once',deny:'Deny',wants:'NanoMuse wants to',pick:'Pick a look',
 hero:[['A new look',['Change your look to an orange cat with round glasses']],['Phone actions — it asks first',['Draft a text to Sam: running 10 minutes late','Copy a polite two-line decline to my clipboard','Add a calendar event tomorrow 9am: dentist, with an alarm']],['Remember & remind',['Remember: I have an iced americano every morning','What do I usually drink in the morning?','Remind me in 2 minutes to stand up and stretch']]]},
 zh:{ph:'输入消息，或让它生成文件…',new:'新对话',mem:'记忆',none:'暂无',title:'属于你的 nanoMuse',sub:'换个形象，让它操作手机（每次都先问你），让它记住、提醒。',
 allow:'允许一次',deny:'拒绝',wants:'NanoMuse 想要',pick:'选一个形象',
 hero:[['换个形象',['换个形象：一只戴圆框眼镜的橘猫']],['手机操作 — 先问你',['给 Sam 写条短信：我晚到十分钟','把一段礼貌的两行拒绝话术复制到剪贴板','明早 9 点加个日历：看牙医，带提醒']],['记住、提醒',['记住：我每天早上喝一杯冰美式','我早上一般喝什么？','2 分钟后提醒我站起来活动一下']]]}};
const tr=k=>T[lang][k];
function applyLang(){inp.placeholder=tr('ph');document.documentElement.lang=lang;ls.set('nm.lang',lang)}
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';applyLang();if(cur&&!cur.messages.length&&!cur.turn)paintAll(cur)};
let dirty=false,timer=0;
const save=()=>{dirty=true;clearTimeout(timer);timer=setTimeout(flush,300)};
const flush=async()=>{if(!dirty)return;dirty=false;try{await kput('kv','convs',convs)}catch(e){dirty=true;console.warn('save',e)}};
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else kick()});

/* ---------- helpers ---------- */
const uid=()=>crypto.randomUUID();
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const status=s=>{stat.textContent=s};
const md=t=>{try{return DOMPurify.sanitize(marked.parse(t||''))}catch{return '<pre>'+esc(t)+'</pre>'}};
const near=()=>chat.scrollHeight-chat.scrollTop-chat.clientHeight<160;
const down=f=>{if(f||near())chat.scrollTop=chat.scrollHeight};
const wire=c=>c.messages.filter(m=>m.role==='user'||m.role==='tool'||m.content||m.tool_calls)
  .map(m=>({role:m.role,content:m.content||'',attachments:m.attachments||[],tool_calls:m.tool_calls||null,tool_call_id:m.tool_call_id||null}))
  .concat((c.extra||[]));

/* ---------- Python in WebAssembly (worker) ---------- */
let worker=null,jobs=new Map();
function getWorker(){
  if(worker)return worker;
  worker=new Worker('/static/nanomuse-worker.js');
  worker.onmessage=e=>{const m=e.data;if(m.t==='status')status(m.s);else if(m.t==='done'){const j=jobs.get(m.id);if(j){jobs.delete(m.id);j(m)}}};
  worker.onerror=()=>{killWorker('Python worker crashed')};
  return worker;
}
function killWorker(why){if(worker){worker.terminate();worker=null}for(const[,j]of jobs)j({text:why,files:[]});jobs.clear()}
function runPy(code,sid){
  return new Promise(res=>{
    const id=uid();let t=setTimeout(()=>killWorker('Timed out after 150s (runtime restarted).'),150000);
    jobs.set(id,m=>{clearTimeout(t);res(m)});
    try{getWorker().postMessage({t:'run',id,code,sid})}catch(e){clearTimeout(t);jobs.delete(id);res({text:'Could not start Python: '+e.message,files:[]})}
  });
}

/* ---------- rendering ---------- */
function fileRow(c,f){
  const d=document.createElement('div');d.className='file';
  d.innerHTML='<span></span><small>'+(f.size/1024).toFixed(1)+' KB</small><button>Save</button>';
  d.firstChild.textContent=f.name;
  d.querySelector('button').onclick=async()=>{
    let blob=null;try{blob=await kget('files',c.id+'/'+f.name)}catch{}
    if(!blob&&f.url){try{const r=await fetch(f.url);if(r.ok){blob=await r.blob();kput('files',c.id+'/'+f.name,blob).catch(()=>{})}}catch{}}
    if(!blob){toast('File is no longer available — ask again to regenerate it.');return}
    const file=new File([blob],f.name,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
    const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
  };
  return d;
}
function toast(t){status(t);setTimeout(()=>{if(stat.textContent===t)status('ready')},3500)}
function paintBot(el,m,c,live){
  let h='';
  for(const t of m.tools||[])h+='<span class="chip'+(t.bad?' bad':'')+'">'+esc(t.label)+'</span>';
  if(h)h='<div>'+h+'</div>';
  h+=m.content?md(m.content):(live&&!(m.tools||[]).length?'<span class="dots"><i></i><i></i><i></i></span>':'');
  el.innerHTML=h;
  el.querySelectorAll('pre').forEach(pre=>{
    const code=pre.textContent,bar=document.createElement('div');bar.className='cb';
    bar.innerHTML='<button>Copy</button><button>Save</button>';
    bar.children[0].onclick=()=>navigator.clipboard?.writeText(code).then(()=>toast('Copied'),()=>toast('Copy blocked'));
    bar.children[1].onclick=()=>{const u=URL.createObjectURL(new Blob([code],{type:'application/octet-stream'})),a=document.createElement('a');a.href=u;a.download='snippet.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),3e4)};
    pre.after(bar);
  });
  for(const f of m.files||[])el.appendChild(fileRow(c,f));
  if(m.err){const e=document.createElement('div');e.className='err';e.textContent=m.err;
    if(!live){const b=document.createElement('button');b.textContent=' Retry';b.onclick=()=>retry(c);e.appendChild(b)}el.appendChild(e)}
}
function bubble(role){const w=document.createElement('div');w.className='msg '+(role==='user'?'user':'bot');const b=document.createElement('div');b.className='bub';
  if(role!=='user'){const a=document.createElement('div');a.className='av';a.innerHTML=look||MARK;w.appendChild(a)}w.appendChild(b);chat.appendChild(w);return b}
const applyLook=()=>document.querySelectorAll('.av').forEach(a=>a.innerHTML=look||MARK);
const cleanSvg=x=>{x=String(x||'').trim();if(!/^<svg[\s>]/i.test(x)||x.length>20000)return '';return DOMPurify.sanitize(x,{USE_PROFILES:{svg:true}})};
function paintUser(m){
  const b=bubble('user');
  for(const a of m.attachments||[]){if(a.kind==='image'){const i=document.createElement('img');i.src=a.data;i.style.cssText='max-width:160px;border-radius:10px;display:block;margin-bottom:6px';b.appendChild(i)}else{const s=document.createElement('div');s.style.cssText='font-size:12px;opacity:.8';s.textContent='📄 '+a.name;b.appendChild(s)}}
  b.appendChild(document.createTextNode(m.content||''));
}
let liveEl=null;
function paintAll(c){
  chat.innerHTML='';liveEl=null;
  if(!c.messages.length&&!c.turn){const h=document.createElement('div');h.className='hero';h.innerHTML='<h1></h1><p></p>';h.firstChild.textContent=tr('title');h.children[1].textContent=tr('sub');
    for(const[t,ps]of tr('hero')){const e=document.createElement('h3');e.textContent=t;h.appendChild(e);for(const q of ps){const b=document.createElement('button');b.textContent=q;b.onclick=()=>{inp.value=q;grow();send()};h.appendChild(b)}}
    chat.appendChild(h);busyUI();return}
  for(const m of c.messages){if(m.role==='user')paintUser(m);else if(m.role==='assistant'&&(m.content||m.files?.length||m.err))paintBot(bubble('bot'),m,c,false)}
  if(c.turn){liveEl=bubble('bot');paintBot(liveEl,c.turn,c,true)}
  down(true);busyUI();
}
let raf=0;const repaint=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(liveEl&&cur&&cur.turn){paintBot(liveEl,cur.turn,cur,true);down()}})};

/* ---------- agent run: survives reloads, background suspend, dropped connections ---------- */
let ctl=null,lastByte=0,stopped=false,driving=null;
const busy=()=>!!(cur&&cur.turn);
function busyUI(){sendB.textContent=busy()?'■':'↑';sendB.disabled=!busy()&&!inp.value.trim()&&!pending.length;status(busy()?'working':'ready')}

function apply(c,ev){
  const t=c.turn,r=c.run;
  if(ev.type==='delta')t.content+=ev.text||'';
  else if(ev.type==='tool'){const a=ev.args||{};t.tools.push({label:ev.name==='web_search'?'searching: '+(a.query||''):ev.name==='fetch_url'?'reading: '+(a.url||''):ev.name==='run_python'?'running code…':ev.name==='write_file'?'writing '+(a.name||'file'):String(ev.name).replace(/_/g,' ')})}
  else if(ev.type==='file'){if(!t.files.some(f=>f.name===ev.name))t.files.push({name:ev.name,size:ev.size,url:ev.url});
    fetch(ev.url).then(x=>x.ok?x.blob():null).then(b=>b&&kput('files',c.id+'/'+ev.name,b)).catch(()=>{})}
  else if(ev.type==='awaiting_client'){r.state='awaiting';r.ev=ev}
  else if(ev.type==='error'){t.err=(t.err?t.err+'\n':'')+(ev.text||'error');r.state='done'}
  else if(ev.type==='done'){r.state='done';r.provider=ev.provider}
}
async function consume(c,res){
  if(!res.body)throw new Error('no stream body');
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){
    const{value,done}=await rd.read();if(done)break;
    lastByte=Date.now();buf+=dec.decode(value,{stream:true});
    const parts=buf.split('\n\n');buf=parts.pop();
    for(const p of parts){const l=p.trim();if(!l.startsWith('data:'))continue;
      let ev;try{ev=JSON.parse(l.slice(5))}catch{continue}
      apply(c,ev);c.run.seen++;
      if(c===cur)repaint();
    }
    save();
  }
}
async function drive(c){
  if(driving)return driving;
  return driving=(async()=>{
    let fails=0;
    try{
      while(c.turn){
        if(stopped)break;
        if(!c.run){
          // start a run (server keeps it going even if we vanish)
          ctl=new AbortController();lastByte=Date.now();
          let res;
          try{res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
            body:JSON.stringify({messages:wire(c),session:c.id,options:{model:profile,code:opts.code,web:opts.web,local_python:opts.local&&opts.code,device:true,memory:mem.map(m=>m.text),lang}})})}
          catch(e){if(stopped)break;if(++fails>6){c.turn.err='Network problem: '+e.message;break}await sleep(fails*1200);continue}
          if(!res.ok){c.turn.err=await errText(res);break}
          const rid=res.headers.get('X-Run-Id');if(!rid){c.turn.err='Server did not return a run id.';break}
          c.run={id:rid,seen:0,state:'streaming'};await flush0();
          try{await consume(c,res)}catch(e){if(stopped)break}
        }else if(c.run.state==='streaming'){
          ctl=new AbortController();lastByte=Date.now();status('reconnecting…');
          let res;
          try{res=await fetch(`/runs/${c.id}/${c.run.id}/stream?since=${c.run.seen}`,{signal:ctl.signal})}
          catch(e){if(stopped)break;if(++fails>40){c.turn.err='Lost connection.';break}await sleep(Math.min(fails*1000,5000));continue}
          if(res.status===404){c.turn.err='This run expired on the server. Tap Retry.';break}
          if(!res.ok){if(++fails>40){c.turn.err=await errText(res);break}await sleep(2000);continue}
          fails=0;status('working');
          try{await consume(c,res)}catch(e){if(stopped)break}
          if(c.run.state==='streaming'&&!stopped)await sleep(600);
        }
        if(stopped)break;
        if(c.run?.state==='awaiting'){
          const ev=c.run.ev;status(ev.name==='run_python'?'running Python (WASM)…':'waiting for you…');
          const out=ev.name==='run_python'?await runPy(ev.args?.code||'',c.id):{text:await clientTool(ev),files:[]};
          const files=[];
          for(const f of out.files||[]){
            const blob=new Blob([f.bytes]);try{await kput('files',c.id+'/'+f.name,blob)}catch{}
            files.push({name:f.name,size:f.size});
          }
          for(const f of files)if(!c.turn.files.some(x=>x.name===f.name))c.turn.files.push(f);
          c.extra=(c.extra||[]).concat([
            {role:'assistant',content:ev.assistant_content||'',tool_calls:[{id:ev.call_id,type:'function',function:{name:ev.name,arguments:JSON.stringify(ev.args||{})}}]},
            {role:'tool',tool_call_id:ev.call_id,content:String(out.text||'').slice(0,9000)}]);
          c.run=null;await flush0();if(c===cur)repaint();continue;
        }
        if(c.run?.state==='done')break;
      }
    }finally{
      const t=c.turn;
      if(t&&(stopped||t.err||(c.run&&c.run.state==='done'))){
        if(stopped&&c.run)fetch(`/runs/${c.id}/${c.run.id}/cancel`,{method:'POST'}).catch(()=>{});
        c.messages.push({role:'assistant',content:t.content,files:t.files,tools:t.tools,err:t.err||''});
        c.turn=null;c.run=null;c.extra=[];
      }
      stopped=false;ctl=null;driving=null;
      await flush0();if(c===cur)paintAll(c);
    }
  })();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const flush0=async()=>{dirty=true;await flush()};
async function errText(res){try{const j=await res.json();return typeof j.detail==='string'?j.detail:JSON.stringify(j.detail)}catch{return 'HTTP '+res.status}}
// iOS suspends sockets in the background: reattach when we return, and if the stream goes silent.
function kick(){if(cur&&cur.turn&&driving&&ctl){try{ctl.abort()}catch{}}else if(cur&&cur.turn&&!driving)drive(cur)}
setInterval(()=>{if(driving&&ctl&&Date.now()-lastByte>35000&&!document.hidden){try{ctl.abort()}catch{}}},5000);
addEventListener('online',kick);
addEventListener('pageshow',e=>{if(e.persisted)kick()});

/* ---------- client tools: memory, reminders, looks, confirmed phone actions ---------- */
const sheetEl=$('sheet'),sp=$('sp');
function sheet(build){return new Promise(res=>{sp.innerHTML='';build(sp,v=>{sheetEl.classList.remove('open');res(v)});sheetEl.classList.add('open')})}
const allowSheet=a=>sheet((p,done)=>{
  const lines=[a.to&&'To: '+a.to,a.subject&&'Subject: '+a.subject,a.title&&a.title,a.start_iso&&'When: '+a.start_iso,a.url,a.text].filter(Boolean).join('\n');
  p.innerHTML='<h4></h4><pre></pre><div class="b"><button>'+esc(tr('deny'))+'</button><button class="ok">'+esc(tr('allow'))+'</button></div>';
  p.querySelector('h4').textContent=tr('wants')+': '+({sms:'draft a text',mail:'draft an email',copy:'copy to clipboard',url:'open a link',ics:'add a calendar event'}[a.kind]||a.kind);
  p.querySelector('pre').textContent=lines||'—';p.querySelectorAll('button')[0].onclick=()=>done(false);p.querySelectorAll('button')[1].onclick=()=>done(true)});
const pickSheet=svgs=>sheet((p,done)=>{
  p.innerHTML='<h4></h4><div class="looks"></div><div class="b"><button>'+esc(tr('deny'))+'</button></div>';p.querySelector('h4').textContent=tr('pick');
  svgs.forEach((x,i)=>{const b=document.createElement('button');b.innerHTML=x;b.onclick=()=>done(i);p.querySelector('.looks').appendChild(b)});p.querySelector('.b button').onclick=()=>done(-1)});
function dl(name,type,text){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3e4)}
const go=h=>{const a=document.createElement('a');a.href=h;a.rel='noopener';document.body.appendChild(a);a.click();a.remove()};
async function doAction(a){
  const q=encodeURIComponent;
  try{
    if(a.kind==='sms'){go('sms:'+(a.to||'')+'&body='+q(a.text||''));return 'Done: Messages draft opened. The user must still tap Send.'}
    if(a.kind==='mail'){go('mailto:'+(a.to||'')+'?subject='+q(a.subject||'')+'&body='+q(a.text||''));return 'Done: Mail draft opened. The user must still tap Send.'}
    if(a.kind==='copy'){await navigator.clipboard.writeText(a.text||'');return 'Done: copied to clipboard.'}
    if(a.kind==='url'){if(!/^https?:\/\//i.test(a.url||''))return 'Failed: only http(s) links.';window.open(a.url,'_blank','noopener');return 'Done: link opened.'}
    if(a.kind==='ics'){const d=new Date(a.start_iso);if(isNaN(d))return 'Failed: start_iso is not a valid date.';
      const f=x=>x.toISOString().replace(/[-:]|\.\d{3}/g,''),e=new Date(+d+36e5),al=Math.max(0,Number(a.alarm_minutes)||10);
      dl('event.ics','text/calendar','BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//NanoMuse//EN\r\nBEGIN:VEVENT\r\nUID:'+uid()+'@nanomuse\r\nDTSTAMP:'+f(new Date)+'\r\nDTSTART:'+f(d)+'\r\nDTEND:'+f(e)+'\r\nSUMMARY:'+String(a.title||'Event').replace(/[\r\n,;]/g,' ')+'\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Reminder\r\nTRIGGER:-PT'+al+'M\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n');
      return 'Done: calendar file offered; the user taps Add to save it.'}
  }catch(e){return 'Failed: '+(e.message||e)}
  return 'Failed: unknown kind.';
}
async function clientTool(ev){
  const a=ev.args||{};
  if(ev.name==='remember'){const t=String(a.text||'').trim().slice(0,300);if(!t)return 'Nothing to remember.';mem.push({id:uid(),text:t});await kput('kv','mem',mem);return 'Saved to memory.'}
  if(ev.name==='set_reminder'){const m=Number(a.minutes);if(!(m>0&&m<=1440))return 'Failed: minutes must be between 0 and 1440.';
    const r={id:uid(),at:Date.now()+m*6e4,text:String(a.text||'Reminder').slice(0,200)};rem.push(r);await kput('kv','rem',rem);
    try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch{}
    return 'Reminder set for '+new Date(r.at).toLocaleTimeString()+'. It fires only while NanoMuse is open.'}
  if(ev.name==='propose_looks'){const v=(Array.isArray(a.svgs)?a.svgs:[]).slice(0,4).map(cleanSvg).filter(Boolean);
    if(!v.length)return 'Failed: send 4 complete <svg> strings.';const i=await pickSheet(v);if(i<0)return 'The user dismissed the options.';
    look=v[i];await kput('kv','look',look);applyLook();return 'The user picked option '+(i+1)+'. New look applied.'}
  if(ev.name==='device_action')return (await allowSheet(a))?await doAction(a):'DENIED by the user. Do not retry.';
  return 'Unknown tool.';
}
function banner(t){const b=$('banner');b.textContent='⏰ '+t;b.classList.add('open');navigator.vibrate?.(200);setTimeout(()=>b.classList.remove('open'),12000)}
function tick(){const now=Date.now(),due=rem.filter(r=>r.at<=now);if(!due.length)return;rem=rem.filter(r=>r.at>now);kput('kv','rem',rem).catch(()=>{});
  for(const r of due){banner(r.text);try{if(window.Notification&&Notification.permission==='granted')new Notification('NanoMuse',{body:r.text})}catch{}}}
setInterval(tick,1000);

/* ---------- sending ---------- */
let pending=[];
function retry(c){
  const last=c.messages[c.messages.length-1];
  if(last?.role==='assistant')c.messages.pop();
  if(c.messages[c.messages.length-1]?.role==='user'){c.turn={content:'',tools:[],files:[],err:''};c.run=null;c.extra=[];save();paintAll(c);drive(c)}
}
async function send(){
  const text=inp.value.trim();if(busy()||(!text&&!pending.length))return;
  const c=cur;c.messages.push({role:'user',content:text,attachments:pending});
  if(c.title==='New chat'&&text)c.title=text.slice(0,40);
  pending=[];$('atts').innerHTML='';inp.value='';grow();
  c.turn={content:'',tools:[],files:[],err:''};c.run=null;c.extra=[];
  await flush0();paintAll(c);drawer(false);drive(c);
}
sendB.onclick=()=>{if(busy()){stopped=true;try{ctl?.abort()}catch{}if(!driving&&cur.turn){stopped=true;drive(cur)}}else send()};
const grow=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px';busyUI()};
inp.oninput=grow;

/* ---------- attachments ---------- */
$('attach').onclick=()=>{const p=document.createElement('input');p.type='file';p.multiple=true;p.accept='image/*,text/*,.md,.json,.csv,.py,.js,.ts,.html,.css,.yml,.yaml,.txt,.xml,.sql';p.onchange=()=>addFiles(p.files);p.click()};
async function addFiles(list){
  for(const f of list){
    const img=f.type.startsWith('image/');
    if(img&&pending.filter(a=>a.kind==='image').length>=4){toast('Max 4 images');continue}
    if(!img&&f.size>300*1024){toast(f.name+' is over 300 KB');continue}
    let data;
    try{if(img){const bm=await createImageBitmap(f),s=Math.min(1,1600/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');
        cv.width=Math.round(bm.width*s);cv.height=Math.round(bm.height*s);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(bm,0,0,cv.width,cv.height);data=cv.toDataURL('image/jpeg',.82)}
      else data=await f.text()}
    catch{toast('Could not read '+f.name);continue}
    const a={kind:img?'image':'text',name:f.name,data};pending.push(a);
    const ch=document.createElement('span');ch.className='chip';ch.textContent=f.name;
    const x=document.createElement('button');x.textContent='×';x.onclick=()=>{pending=pending.filter(p=>p!==a);ch.remove();busyUI()};ch.appendChild(x);$('atts').appendChild(ch);busyUI();
  }
}

/* ---------- conversations & settings ---------- */
function newChat(){
  const f=convs[0];if(f&&!f.messages.length&&!f.turn){cur=f}
  else{cur={id:uid(),title:'New chat',messages:[],turn:null,run:null,extra:[]};convs.unshift(cur)}
  ls.set('nm.cur',cur.id);save();paintAll(cur);drawer(false);
}
function openChat(id){const c=convs.find(x=>x.id===id);if(!c)return;cur=c;ls.set('nm.cur',id);paintAll(c);drawer(false);if(c.turn&&!driving)drive(c)}
function drawer(open){
  const d=$('drawer');if(open===false||open===undefined&&d.classList.contains('open')){d.classList.remove('open');return}
  if(open===undefined)open=true;
  const p=$('dp');p.innerHTML='<button class="new"></button>';p.firstChild.textContent=tr('new');
  p.firstChild.onclick=newChat;
  for(const c of convs.slice(0,50)){
    const r=document.createElement('div');r.className='c'+(c===cur?' on':'');
    r.innerHTML='<span></span><button aria-label="Delete">🗑</button>';r.firstChild.textContent=c.title||'Untitled';
    r.firstChild.onclick=()=>openChat(c.id);
    r.lastChild.onclick=async()=>{if(!confirm('Delete this chat?'))return;
      convs=convs.filter(x=>x!==c);
      const keys=await tx('files','readonly',o=>o.getAllKeys()).catch(()=>[]);
      for(const k of keys||[])if(String(k).startsWith(c.id+'/'))kdel('files',k).catch(()=>{});
      if(c===cur){newChat();if(!convs.length)return}await flush0();drawer(true)};
    p.appendChild(r);
  }
  const h=document.createElement('h5');h.textContent=tr('mem')+' ('+mem.length+')';p.appendChild(h);
  if(!mem.length){const n=document.createElement('div');n.className='mem';n.innerHTML='<span></span>';n.firstChild.textContent=tr('none');p.appendChild(n)}
  for(const m of mem){const r=document.createElement('div');r.className='mem';r.innerHTML='<span></span><button>×</button>';r.firstChild.textContent=m.text;
    r.lastChild.onclick=async()=>{mem=mem.filter(x=>x!==m);await kput('kv','mem',mem);drawer(true)};p.appendChild(r)}
  d.classList.add('open');
}
$('menu').onclick=()=>drawer();
$('drawer').onclick=e=>{if(e.target.id==='drawer')drawer(false)};
const tog=(id,k)=>{const b=$(id);b.classList.toggle('on',!!opts[k]);b.onclick=()=>{opts[k]=!opts[k];if(k==='local'&&opts.local){opts.code=true;$('ocode').classList.add('on');try{getWorker().postMessage({t:'warm'})}catch{}}
  if(k==='code'&&!opts.code){opts.local=false;$('olocal').classList.remove('on')}b.classList.toggle('on',opts[k]);ls.set('nm.opts',opts)}};
tog('oweb','web');tog('ocode','code');tog('olocal','local');
fetch('/profiles').then(r=>r.json()).then(d=>{const s=$('prof');s.innerHTML='';for(const p of d.profiles){const o=document.createElement('option');o.value=p.id;o.textContent=p.id[0].toUpperCase()+p.id.slice(1);o.title=p.label;s.appendChild(o)}s.value=profile}).catch(()=>{});
$('prof').onchange=e=>{profile=e.target.value;ls.set('nm.profile',profile)};

/* ---------- boot: restore everything, then reattach to any run still in flight ---------- */
(async()=>{
  try{convs=(await kget('kv','convs'))||[]}catch{convs=[]}
  if(!Array.isArray(convs))convs=[];
  try{mem=(await kget('kv','mem'))||[];rem=(await kget('kv','rem'))||[];look=(await kget('kv','look'))||''}catch{}
  applyLang();tick();
  if(!convs.length)newChat();
  else{cur=convs.find(c=>c.id===ls.get('nm.cur',''))||convs[0];paintAll(cur)}
  if(cur.turn)drive(cur);
  if(opts.local&&opts.code)try{getWorker().postMessage({t:'warm'})}catch{}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  busyUI();
})();
})();
</script>
