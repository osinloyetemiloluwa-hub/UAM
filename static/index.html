<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Uncensored Agent Demo</title>
<style>
  :root { --bg:#0d0f13; --panel:#151920; --line:#242a35; --fg:#e6e9ef; --dim:#8b93a7; --accent:#5b8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:10px; }
  header b { font-size:15px; letter-spacing:.2px; }
  #provider { margin-left:auto; font-size:12px; color:var(--dim);
              border:1px solid var(--line); border-radius:99px; padding:2px 10px; }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:min(760px,92%); padding:11px 14px; border-radius:12px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#1d2534; border:1px solid #2b3648; }
  .bot  { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .err  { align-self:flex-start; background:#2a1a1a; border:1px solid #4a2626; color:#ffb4b4; }
  form { display:flex; gap:10px; padding:14px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--fg);
             border:1px solid var(--line); border-radius:10px; padding:11px 12px;
             font:inherit; height:48px; }
  textarea:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px;
           padding:0 20px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--dim); font-size:12.5px; text-align:center; padding:0 18px 12px; }
</style>
</head>
<body>
<header><b>Uncensored Agent Demo</b><span id="provider">idle</span></header>
<div id="log"></div>
<div class="hint">Try: "what time is it", "what's 17*23 + sqrt(144)", or ask something opinionated.</div>
<form id="form">
  <textarea id="input" placeholder="Say something..." autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const providerEl = document.getElementById('provider');
const history = [];

function bubble(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  bubble(text, 'user');
  history.push({ role: 'user', content: text });

  const pending = bubble('...', 'bot');
  send.disabled = true;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);

    pending.textContent = data.reply || '(empty)';
    providerEl.textContent = data.provider || 'ok';
    history.push({ role: 'assistant', content: data.reply || '' });
  } catch (err) {
    pending.className = 'msg err';
    pending.textContent = 'Error: ' + err.message;
    history.pop(); // let the user retry the same message
  } finally {
    send.disabled = false;
    input.focus();
    log.scrollTop = log.scrollHeight;
  }
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
</script>
</body>
</html>
